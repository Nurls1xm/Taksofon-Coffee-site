<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Display - Taksofon Coffee</title>
    <link rel="stylesheet" href="css/order-display.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="display-container">
        <!-- Header -->
        <header class="display-header">
            <div class="logo">
                <img src="image/TaksofonCoffeeLogo.png" alt="Taksofon Coffee">
                <h1>Taksofon Coffee</h1>
            </div>
            <div class="current-time" id="currentTime"></div>
        </header>

        <!-- Main Display -->
        <main class="display-main">
            <div class="ready-orders-section">
                <h2><i class="fas fa-check-circle"></i> Ready Orders</h2>
                <div class="orders-grid" id="readyOrdersGrid">
                    <!-- Ready orders will be displayed here -->
                </div>
            </div>

            <div class="preparing-orders-section">
                <h3><i class="fas fa-clock"></i> Preparing Orders</h3>
                <div class="preparing-list" id="preparingOrdersList">
                    <!-- Preparing orders will be displayed here -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="display-footer">
            <p>Please check your order number above • Thank you for choosing Taksofon Coffee!</p>
        </footer>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/order-display.js"></script>
</body>
</html>
